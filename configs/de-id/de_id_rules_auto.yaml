  regex:
  - \d{2}.\d{2}.\d{4}
  - \d{3}[-.\s]?\d{3}[-.\s]?\d{4}
  - \d{2}/\d{2}/\d{4}
  - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}'
  - \d{5}(?:[-\s]\d{4})?
  - \d{2}-\d{2}-\d{4}
  - \d{3}-\d{2}-\d{4}
  - \b(19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])\b  #date in format of yyyymmdd
  - \b(19\d{2}|20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]\b  #datetime in the format of yyyymmddhhMMss
  - \d{10} #tel
  - '\b([A-Z][a-z]+)\s+([A-Z][a-z]+)\b' #two words starting with capital letter as name
  - \b\d+\s+[A-Za-z]+\s+[A-Za-z]+\s+(?:St|Ave|Blvd|Rd|Dr|Ln|Ct|Way|Pl)\s+[A-Za-z\s]+,\s+[A-Z]{2}\s+\d{5}\b #address
  